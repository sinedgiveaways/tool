name: run-analysis

on:
  pull_request:
    branches:
      - nx2
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      asset_sub:
        description: 'motif du nom d asset minidump'
        default: 'dmp'
      sp:
        description: 'guest sp a l abort (hex)'
        default: '1183f9e00'
      frames:
        description: 'offsets de frame connus (hex, sep espaces)'
        default: '10a0 1f9878 181cc8 b9214 175a16c 1750b88 1750650 1718cf8 1d77d64 16198b4'
      spans:
        description: 'fenetres start:end (hex, sep espaces)'
        default: '181b00:181d10 175a100:175a250 1750b00:1750c00 1750600:17506e0 1718c80:1718d40 1d77d00:1d77dc0 1619880:16198e0 bf030:bf070 1c690:1c6d0 b9180:b91f0'

permissions:
  contents: write

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download minidump from release analysis-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh release download analysis-data --repo "$GITHUB_REPOSITORY" --pattern "*${{ inputs.asset_sub }}*" --clobber --dir dl
          ls -la dl

      - name: Unzip
        run: |
          cd dl
          for z in *.zip; do unzip -o "$z"; done
          DMP=$(find . -type f -name '*.dmp' | head -1)
          echo "DMP=$DMP" >> "$GITHUB_ENV"
          test -n "$DMP"

      - name: Extract spans
        run: |
          python3 tools/analyze.py --dmp "$DMP" --sp "${{ inputs.sp }}" --frames "${{ inputs.frames }}" --spans "${{ inputs.spans }}" --out analysis
          head -40 analysis/main-base.txt

      - name: Commit results
        run: |
          git config user.name analysis-bot
          git config user.email actions@github.com
          git add analysis
          git commit -m "analysis results (run ${{ github.run_id }})" || echo rien
          git push

  extract-memcpy-wrapper:
    if: github.event_name == 'pull_request' && github.head_ref == 'analysis/extract-orbitals-caller-1b5a8ff0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout analysis PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download original crash dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl dump
          gh release download analysis-data --repo "$GITHUB_REPOSITORY" --pattern "*dmp*" --clobber --dir dl
          for z in dl/*.zip; do unzip -q "$z" -d dump; done
          DMP="$(find dump -type f -name '*.dmp' -print -quit)"
          test -n "$DMP"
          echo "DMP=$GITHUB_WORKSPACE/$DMP" >> "$GITHUB_ENV"

      - name: Extract wrapper, caller, and native tracker
        run: |
          python -m pip install --disable-pip-version-check capstone
          python tools/extract_orbitals_caller.py "$DMP"

      - uses: actions/upload-artifact@v4
        with:
          name: orbitals-wrapper-dispatch-analysis
          path: orbitals_exception_analysis/
          if-no-files-found: error
          retention-days: 14
